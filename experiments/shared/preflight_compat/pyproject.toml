[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "siderius-preflight-compat"
version = "0.2.4"
description = "Explicit historical SIDERIUS static preflight arithmetic"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]

[project.entry-points."siderius.preflight_estimators"]
legacy-078b23ca-preflight-v1 = "siderius_preflight_compat:historical_profile"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
siderius_preflight_compat = ["*.json"]
