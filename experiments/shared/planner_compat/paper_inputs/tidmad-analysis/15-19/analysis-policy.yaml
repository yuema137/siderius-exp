schema_version: 1
scientific_goal: Characterize authorized raw waveform inputs in the selected band.
input_description: Integer-coded SQUID detector waveform samples at the task-declared
  physical cadence. The view contains one input channel and performs no interpolation,
  resampling, filtering, or repair.
target_description: Clean injected waveform, not visible in the initial raw-data analysis.
scientific_constraints:
- Every certified selection must cover the selected files [15, 16, 17, 18, 19] or
  refuse.
- Findings concern sampled raw validation windows, not unseen data or hidden targets.
- Use the declared physical cadence; distinguish measured findings from hypotheses.
