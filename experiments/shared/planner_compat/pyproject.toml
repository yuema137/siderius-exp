[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "siderius-planner-compat"
version = "0.11.1"
description = "Experiment-owned historical SIDERIUS planner prompt providers"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]

[project.optional-dependencies]
historical-runtime = ["siderius-runtime-compat==0.1.2"]

[project.entry-points."siderius.planner_strategies"]
legacy-9b78d505cb11-paper-watchdog-v10 = "siderius_planner_compat.watchdog_policy_v10:historical_watchdog_v10"
legacy-9b78d505cb11-paper-late-watchdog-v10 = "siderius_planner_compat.watchdog_policy_v10:historical_watchdog_late_v10"
legacy-9b78d505cb11-paper-epochs-v9 = "siderius_planner_compat.epoch_manual_v9:historical_epochs_v9"
legacy-9b78d505cb11-paper-late-epochs-v9 = "siderius_planner_compat.epoch_manual_v9:historical_epochs_late_v9"
legacy-9b78d505cb11-paper-verifier-v8 = "siderius_planner_compat.runtime_verifier_v8:historical_verifier_v8"
legacy-9b78d505cb11-paper-late-verifier-v8 = "siderius_planner_compat.runtime_verifier_v8:historical_verifier_late_v8"
legacy-9b78d505cb11-paper-storage-v7 = "siderius_planner_compat.storage_provenance_v7:historical_storage_v7"
legacy-9b78d505cb11-paper-late-storage-v7 = "siderius_planner_compat.storage_provenance_v7:historical_storage_late_v7"
legacy-9b78d505cb11-paper-preflight-v6 = "siderius_planner_compat.static_preflight_v6:historical_preflight_v6"
legacy-9b78d505cb11-paper-late-preflight-v6 = "siderius_planner_compat.static_preflight_v6:historical_preflight_late_v6"
legacy-9b78d505cb11-paper-runtime-v5 = "siderius_planner_compat.runtime_feedback_v5:historical_runtime_v5"
legacy-9b78d505cb11-paper-late-runtime-v5 = "siderius_planner_compat.runtime_feedback_v5:historical_runtime_late_v5"
legacy-9b78d505cb11-paper-v4 = "siderius_planner_compat.paper_v4:historical_paper_v4"
legacy-9b78d505cb11-paper-late-v4 = "siderius_planner_compat.paper_v4:historical_paper_late_v4"
legacy-9b78d505cb11-attempt-role-v3 = "siderius_planner_compat.attempt_role_v3:historical_attempt_role_v3"
legacy-9b78d505cb11-ordering-v2 = "siderius_planner_compat.ordering_v2:historical_ordering_v2"
legacy-9b78d505cb11-v1 = "siderius_planner_compat:current_legacy"
legacy-691617f04b42-v1 = "siderius_planner_compat:early_legacy"

[project.entry-points."siderius.planner_strategy_defaults"]
legacy-9b78d505cb11-v1 = "siderius_planner_compat:current_legacy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
siderius_planner_compat = ["fixtures/*.json", "watchdog-qualification.json"]
