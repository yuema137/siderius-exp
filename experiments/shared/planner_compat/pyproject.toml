[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "siderius-planner-compat"
version = "0.5.0"
description = "Experiment-owned historical SIDERIUS planner prompt providers"
requires-python = ">=3.12"

[project.entry-points."siderius.planner_strategies"]
legacy-9b78d505cb11-paper-runtime-v5 = "siderius_planner_compat.runtime_feedback_v5:historical_runtime_v5"
legacy-9b78d505cb11-paper-late-runtime-v5 = "siderius_planner_compat.runtime_feedback_v5:historical_runtime_late_v5"
legacy-9b78d505cb11-paper-v4 = "siderius_planner_compat.paper_v4:historical_paper_v4"
legacy-9b78d505cb11-paper-late-v4 = "siderius_planner_compat.paper_v4:historical_paper_late_v4"
legacy-9b78d505cb11-attempt-role-v3 = "siderius_planner_compat.attempt_role_v3:historical_attempt_role_v3"
legacy-9b78d505cb11-ordering-v2 = "siderius_planner_compat.ordering_v2:historical_ordering_v2"
legacy-9b78d505cb11-v1 = "siderius_planner_compat:current_legacy"
legacy-691617f04b42-v1 = "siderius_planner_compat:early_legacy"

[project.entry-points."siderius.planner_strategy_defaults"]
legacy-9b78d505cb11-v1 = "siderius_planner_compat:current_legacy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
siderius_planner_compat = ["fixtures/*.json"]
