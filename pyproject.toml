[project]
name = "siderius-exp"
version = "0.0.0"
description = "Scientific tasks and experiment campaigns for SIDERIUS"
requires-python = ">=3.12"
dependencies = [
    "siderius @ git+https://github.com/yuema137/SIDERIUS.git@b13b9263c939c33b8d06361b1ae2fd0f99c3a900",
    "torch==2.10.0",
    "siderius-planner-compat==0.9.0",
    "siderius-preflight-compat==0.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.12,<0.17",
]
tutorial = [
    "jupyterlab>=4,<5",
    "nbclient>=0.10,<0.11",
    "pyarrow>=19,<24",
]

[tool.uv]
package = false

[tool.uv.sources]
siderius-planner-compat = { path = "experiments/shared/planner_compat", editable = false }

siderius-preflight-compat = { path = "experiments/shared/preflight_compat", editable = false }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
norecursedirs = ["provenance", ".git", ".venv"]
markers = ["real_data: reads an explicitly configured external scientific dataset"]
