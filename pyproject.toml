[project]
name = "siderius-exp"
version = "0.0.0"
description = "Private scientific tasks and experiment campaigns for SIDERIUS"
requires-python = ">=3.12"
dependencies = [
    "siderius @ git+https://github.com/Galileo-Sandbox/SIDERIUS.git@50a563521e8578d2b18eeb5d71f78b1e11e86257",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.12,<0.17",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
norecursedirs = ["provenance", ".git", ".venv"]
markers = ["real_data: reads an explicitly configured external scientific dataset"]
