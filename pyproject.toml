[project]
name = "siderius-exp"
version = "0.0.0"
description = "Private scientific tasks and experiment campaigns for SIDERIUS"
requires-python = ">=3.12"
dependencies = [
    "siderius @ git+https://github.com/yuema137/SIDERIUS.git@e800fc1f08b0e067fc21076a200f3f70d04b38b8",
    "torch==2.10.0",
    "siderius-planner-compat==0.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.12,<0.17",
]
tutorial = [
    "jupyterlab>=4,<5",
    "nbclient>=0.10,<0.11",
    "pyarrow>=19,<24",
]

[tool.uv]
package = false

[tool.uv.sources]
siderius-planner-compat = { path = "experiments/shared/planner_compat", editable = false }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
norecursedirs = ["provenance", ".git", ".venv"]
markers = ["real_data: reads an explicitly configured external scientific dataset"]
