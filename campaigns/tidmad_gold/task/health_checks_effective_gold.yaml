# Materialized effective HealthGate config — do not edit.
# Written by materialize_effective_config (enable_partial_file_list DS4).
# source: configs/health_checks.yaml
# health_gate_files: None
# sha256: f9059693f5de551aac7e4a73a6e9887db72fae276eda704132dc2c1fdbc2dc6c
health_gates:
- after_round: every
  checks:
  - config:
      min_unique_int8_values: 25
      peek_file_indices:
      - 3
      - 10
      - 17
      peek_samples: 100000
    name: output_diversity
  gate_role: observational
  id: output_diversity_blocking
  on_fail:
    action: continue
  on_pass:
    action: continue
  reason: "Blocking diversity gate. FCNet real-learning reproduction has unique_int8=127+;\
    \ the worst observed non-collapse baseline had 15. Threshold of 25 gives 2.08\xD7\
    \ FCNet safety margin and 40% baseline rejection headroom. M9 peek: [3, 10, 17]\
    \ + all_pass (C2 flip, 2026-08-26) \u2014 file 3 is the narrowest-margin FCNet\
    \ band (52 uniq), file 10 first mid-band exemplar (127), file 17 high-band exemplar\
    \ (143). All_pass means a real learning model must clear the bar on EVERY peeked\
    \ file; diversity collapse on any single peeked file fails the gate."
  short_circuit: false
- after_round: every
  checks:
  - config:
      min_std_mv: 1.0
      peek_file_indices:
      - 3
      - 10
      - 17
      peek_samples: 100000
      value_scale_unit: mV
      value_scale_units_per_sample: 0.3125
    name: output_std
  gate_role: observational
  id: output_std_blocking
  on_fail:
    action: continue
  on_pass:
    action: continue
  reason: "Blocking std gate. Complements output_diversity \u2014 an output with many\
    \ unique values but tight std (edge-case not observed but theoretically possible)\
    \ would also fail here. 1.0 mV threshold gives ~5\xD7 margin above worst-observed\
    \ collapse (0.19 mV). M9 peek matches output_diversity: [3, 10, 17] + all_pass\
    \ (C2 flip, 2026-08-26)."
  short_circuit: false
- after_round: every
  checks:
  - config:
      aggregation: all_pass
      collapse_threshold: 0.95
      peek_file_indices:
      - 3
      - 10
      - 17
      peek_samples: 100000
    name: amplitude_collapse
  gate_role: blocking
  id: amplitude_collapse_blocking
  on_fail:
    action: invalidate_round
  on_pass:
    action: continue
  reason: "Blocking amplitude gate. Catches single-value-dominance collapse even when\
    \ unique_count is above threshold (e.g. output has 40 unique values but 96% are\
    \ the same one). Threshold 0.95 unchanged from rev-6; extended to every round.\
    \ M9 peek: [3, 10, 17] + all_pass (C2 flip, 2026-08-26): a partial-collapse case\
    \ where ONE peeked file has 96% dominance now fails the gate even when the other\
    \ two are healthy. The flip discharges the m9 execution plan \xA79 Q1 deferral\
    \ of exactly this choice to post-V17 empirical validation."
  short_circuit: true
- after_round: every
  checks:
  - config:
      peek_samples: 1000000
      value_scale_unit: mV
      value_scale_units_per_sample: 0.3125
    name: pearson_dispersion
  gate_role: observational
  id: pearson_dispersion_recording
  on_fail:
    action: continue
  on_pass:
    action: continue
  reason: "Records the spread of per-file pearson(CH1_denoised, CH2_target) as a single\
    \ scalar: pearson_dispersion = stdev(per_file_pearsons, ddof=1). Empirical 24\xD7\
    \ separation between real learning (FCNet ~0.048) and paper-spec collapse (~0.002).\
    \ Per-file pearson values are computed internally but NOT exposed \u2014 they\
    \ were shown to be uninformative per-file (noise-limited on files 0-9; can sign-invert\
    \ on high-signal files). See docs/design/paper_and_collapse_reference_baselines.md\
    \ \xA76.3."
  short_circuit: false
- after_round: every
  checks:
  - config:
      peek_samples: 1000000
      value_scale_unit: mV
      value_scale_units_per_sample: 0.3125
    name: spectral_peak_ratio
  gate_role: observational
  id: spectral_peak_ratio_recording
  on_fail:
    action: continue
  on_pass:
    action: continue
  reason: Records PSD(f_inj) / median(PSD_around_f_inj) per file. Direct spectral
    analog of the scoring pipeline's SNR; useful for detecting the "phantom scored
    high" case without triggering it. Never blocks.
  short_circuit: false
- after_round: every
  checks:
  - config:
      peek_samples: 100000
      value_scale_unit: mV
      value_scale_units_per_sample: 0.3125
    name: per_file_output_std
  gate_role: observational
  id: per_file_output_std_recording
  on_fail:
    action: continue
  on_pass:
    action: continue
  reason: Records per-file output std distribution (mean, min, max, per-file list).
    Complements output_std_blocking (aggregate) with per-file granularity for diagnosis.
    Never blocks.
  short_circuit: false
task_health_binding: explicit
