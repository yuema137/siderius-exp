task_data_path:
  file: ../plugins/_majorana_task.py
  symbol: MajoranaTaskDataPath
  id: majorana_low_avse

dataset_profile:
  config: ../declared/dataset_profile.json

metric:
  declaration: ../declared/metric_energy_matched_auc.json
  implementation:
    file: ../plugins/_majorana_metrics.py
    symbol: MajoranaEnergyMatchedAuc

secondary_metrics:
  - declaration: ../declared/metric_ordinary_auc.json
    implementation:
      file: ../plugins/_majorana_metrics.py
      symbol: MajoranaOrdinaryAuc

objective:
  config: {loss_type: ce, reduction: mean}
task_health: {none: true}
interpretation_blocks: {none: true}
proposal_blocks: {config: ../declared/proposal_blocks.yaml}
implementor_blocks: {config: ../declared/implementor_blocks.yaml}
task_config: {config: ../declared/task_config.yaml}
model_plugins:
  dir: ../plugins
  require: [majorana_reference_cnn]
parameter_rules:
  model_config.segmentation_size: {exact: 3800}
