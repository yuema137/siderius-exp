enabled: false
root_papers:
  - source_type: doi
    identifier: "10.5281/zenodo.8257027"
    verbosity: 1
  - source_type: arxiv
    identifier: "2308.10856"
    verbosity: 1
dynamic_search:
  enabled: true
  max_rounds: 2
  initial_verbosity: 0
  escalation_allowed: true
  results_per_query: 8
  max_escalations_per_round: 1
findings_verbosity: 1
synthesis: {transfer_tolerance: moderate}
confidence_rubric:
  omit_below: 0.40
  abstract_only_ceiling: 0.79
  bands:
    - {lower: 0.80, upper: 1.00, criteria: "deep-read and directly applicable to HPGe waveform pulse-shape classification"}
    - {lower: 0.60, upper: 0.79, criteria: "deep-read with a clear transferable waveform-classification mechanism"}
    - {lower: 0.40, upper: 0.59, criteria: "abstract-only or cross-domain evidence with a plausible transfer rationale"}
