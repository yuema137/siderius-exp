architect_role: >-
  event-classification architect for detector observables and unordered
  variable-length tracker-hit collections
output_contract_guidance: >-
  Produce two raw logits ordered [background, signal]. Never consume theta,
  phiS, ev_no, or the process label as an input feature.
evidence_reading: >-
  Select only by energy-matched ROC AUC. Ordinary ROC AUC is observational and
  may be inflated by the energy spectrum.
input_semantics: >-
  fixed event observables plus a padded unordered set of tracker hits with an
  explicit validity marker and tR-missingness channel
continuous_output_meaning: "not applicable; this is categorical classification"
per_file_strategy_guidance: >-
  Use deterministic snapshot scopes. Never split tracker-hit rows independently.
target_strategy_selector_clause: ""
evidence_rationale_clause: " and the energy-matched ROC evidence"
evidence_citation_clause: ", including the energy-matched ROC AUC"
