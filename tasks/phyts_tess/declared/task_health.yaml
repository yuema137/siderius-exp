# PhyTS TESS — task-owned Health family.
#
# Binds through the EXTERNAL interface (explicit task-health-config path plus
# a config-named pack plugin), which is the route an out-of-tree task takes.
# No SIDERIUS source names this file.
#
# THRESHOLD PROVENANCE, stated honestly.
#
# Unlike the DAVIS family, this floor is NOT calibrated against a measured
# healthy prediction artifact, because no PhyTS TESS run has produced one
# yet. It is derived from the TARGET spread of the released data, measured
# once from tasks/phyts_tess/data/manifests/rotation_identity.csv:
#
#     train  n = 3338   population std of frot = 0.6927 cycles/day
#     val    n =  442   population std of frot = 0.5618 cycles/day
#
# A model that has collapsed onto one answer disperses at exactly 0. The
# floor 0.05 sits about 11x below the validation target spread, so it
# separates a collapse from a merely poor model rather than from a good one.
#
# DISPOSITION IS `recording`, DELIBERATELY. The task-definition guide's
# advice is to start recording, run once, look at what the check actually
# reports on real predictions, and only then promote. Declaring a blocking
# threshold before any real artifact exists would be guessing at which
# rounds to invalidate.
#
# PROMOTION PATH, so this does not quietly stay provisional: after the first
# real run, read the recorded `sample_dispersion` metric from the persisted
# gate results for the rounds whose R-squared was healthy, and if the
# observed healthy dispersion sits comfortably above this floor, change
# `disposition` to `blocking` and replace this note with the measured value
# and its artifact sha256. Until then, a collapsed model is recorded and
# scored, not invalidated.

facts:
  # Opaque family value. Its job is to make the int8-specific TIDMAD checks
  # honestly INAPPLICABLE here. The generic dispersion check declares no
  # facts: binding the continuous_samples capability IS its applicability.
  encoding_family: continuous_float

plugins:
  # Underscore-prefixed so neither generic directory scanner (the ML plugin
  # loader; the Health directory-kind loader) ever execs it as a scanned
  # member — this explicit file ref is its only loading path.
  - kind: file
    ref: ../plugins/_tess_health_views.py

providers:
  - provider_id: phyts_tess.prediction_views

roster:
  - gate_id: phyts_tess_prediction_dispersion
    check: sample_dispersion_floor
    disposition: recording
    parameters:
      min_dispersion: 0.05
    reason: >-
      A rotation-frequency regressor whose predictions barely vary across
      the evaluation scope has collapsed onto a single answer. The released
      validation targets disperse at 0.5618 cycles per day, so predictions
      dispersing below 0.05 are near-constant rather than merely inaccurate.
